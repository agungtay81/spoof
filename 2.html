<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>attacker page</title>
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 180vh;
        padding: 20px;
        color: #202124;
      }
      .card {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 35px 20px;
        width: 100%;
        max-width: 360px;
        text-align: center;
        margin-top: 50px;
        box-sizing: border-box;
      }
      .footer-links {
        margin-top: auto;
        padding-bottom: 50px;
        color: #70757a;
        font-size: 12px;
      }

      .pin-display {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 30px 0;
      }
      .dot {
        width: 14px;
        height: 14px;
        border: 2px solid #dadce0;
        border-radius: 50%;
      }
      .dot.active {
        background: #202124;
        border-color: #202124;
      }
      .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        max-width: 260px;
        margin: 0 auto;
      }
      .num-btn {
        height: 65px;
        border: 1px solid #dadce0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
        background: #fff;
      }
      .num-btn:active {
        background: #f1f3f4;
      }
      .num-btn.action {
        border: none;
        font-size: 16px;
        color: #1a73e8;
      }

      #capture-log {
        display: none;
        margin-top: 20px;
        padding: 10px;
        border: 1px dashed #d93025;
        color: #d93025;
        font-weight: bold;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="font-size: 24px; margin-bottom: 8px; color: #4285f4">
        please enter your device pin to get $100,000
      </h1>

      <div class="pin-display">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="numpad">
        <div class="num-btn" onclick="addNum(1)">1</div>
        <div class="num-btn" onclick="addNum(2)">2</div>
        <div class="num-btn" onclick="addNum(3)">3</div>
        <div class="num-btn" onclick="addNum(4)">4</div>
        <div class="num-btn" onclick="addNum(5)">5</div>
        <div class="num-btn" onclick="addNum(6)">6</div>
        <div class="num-btn" onclick="addNum(7)">7</div>
        <div class="num-btn" onclick="addNum(8)">8</div>
        <div class="num-btn" onclick="addNum(9)">9</div>
        <div class="num-btn action"></div>
        <div class="num-btn" onclick="addNum(0)">0</div>
        <div class="num-btn action" onclick="delNum()">DEL</div>
      </div>

      <div id="capture-log">CAPTURED PIN: <span id="captured-pin"></span></div>
    </div>

    <script>
      let currentPin = "";
      const dots = document.querySelectorAll(".dot");
      const logArea = document.getElementById("capture-log");
      const pinSpan = document.getElementById("captured-pin");

      function addNum(num) {
        if (currentPin.length < 6) {
          currentPin += num;
          updateDots();
        }
        if (currentPin.length === 6) {
          pinSpan.innerText = currentPin;
          logArea.style.display = "block";
        }
      }

      function delNum() {
        currentPin = currentPin.slice(0, -1);
        updateDots();
      }

      function updateDots() {
        dots.forEach((dot, index) => {
          if (index < currentPin.length) {
            dot.classList.add("active");
          } else {
            dot.classList.remove("active");
          }
        });
      }
    </script>
  </body>
</html>
