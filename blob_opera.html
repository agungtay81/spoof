<!DOCTYPE html>
<html>
<head><title>Blob PoC</title></head>
<body>
<h1>Opening blob URL...</h1>
<script>
  // Test 1 - Konten sangat simple
  const content = '<h1 style="color:red;">BLOB TEST</h1>';
  
  const blob = new Blob([content], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url);
</script>
</body>
</html>
