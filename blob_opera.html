<button onclick="openBlob()">Click</button>
<script>
function openBlob() {
  const blob = new Blob([`
    <html><body style="background:black;
    color:white;text-align:center;
    padding-top:40vh;font-family:Arial;">
    <h1>Address Bar Spoofing</h1>
    </body></html>
  `], {type:"text/html"});
  
  // Coba buka di iframe
  const iframe = document.createElement('iframe');
  iframe.src = URL.createObjectURL(blob);
  iframe.style.cssText = 
    'position:fixed;inset:0;width:100%;height:100%;border:none;';
  document.body.appendChild(iframe);
}
</script>
