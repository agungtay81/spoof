<!DOCTYPE html>
<html>
<body>
<button onclick="a()">Click me</button>

<script>
function a() {
  const tab = window.open(
    "https://www.google.com/csi", "_blank"
  );
  
  if (!tab) { alert("Blocked!"); return; }

  [0, 50, 200, 500, 1000].forEach(delay => {
    setTimeout(() => {
      
      // Cara 1 - innerHTML
      try {
        tab.document.body.innerHTML = '<h1>test</h1>';
        alert('innerHTML OK at ' + delay + 'ms');
      } catch(e) {}

      // Cara 2 - document.write
      try {
        tab.document.write('<h1>test</h1>');
        alert('write OK at ' + delay + 'ms');
      } catch(e) {}

      // Cara 3 - eval
      try {
        tab.eval('alert("eval OK at ' + delay + 'ms")');
      } catch(e) {}

      // Cara 4 - createElement
      try {
        const el = tab.document.createElement('h1');
        el.textContent = 'test';
        tab.document.body.appendChild(el);
        alert('createElement OK at ' + delay + 'ms');
      } catch(e) {}

    }, delay);
  });
}
</script>
</body>
</html>
